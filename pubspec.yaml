name: shift_calendar_engine
description: "Cross-platform roster, validation, reporting, and calendar workflow."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5

  workforce_core:
    path: packages/workforce_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  generate: true

  assets:
    - assets/fonts/NotoSansThai.ttf

  uses-material-design: true
