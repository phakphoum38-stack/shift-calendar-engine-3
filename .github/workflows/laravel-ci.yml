name: Laravel CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/api/**"
      - ".github/workflows/laravel-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/api/**"
      - ".github/workflows/laravel-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        database:
          - sqlite
          - postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shift_calendar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shift_calendar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare SQLite database
        if: matrix.database == 'sqlite'
        run: touch database/database.sqlite

      - name: Run SQLite migrations and tests
        if: matrix.database == 'sqlite'
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          php artisan migrate:fresh --force
          php artisan test

      - name: Run PostgreSQL migrations and tests
        if: matrix.database == 'postgres'
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: shift_calendar_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan migrate:fresh --force
          php artisan test