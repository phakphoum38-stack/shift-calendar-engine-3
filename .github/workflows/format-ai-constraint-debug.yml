name: Format AI Constraint Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-ai-constraint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target files
        run: dart format packages/workforce_core/lib/src/ai_scheduler/ai_constraint_plugin.dart packages/workforce_core/test/ai_constraint_plugin_test.dart
      - name: Print formatted files
        run: |
          echo '---PLUGIN_START---'
          cat packages/workforce_core/lib/src/ai_scheduler/ai_constraint_plugin.dart
          echo '---PLUGIN_END---'
          echo '---TEST_START---'
          cat packages/workforce_core/test/ai_constraint_plugin_test.dart
          echo '---TEST_END---'
