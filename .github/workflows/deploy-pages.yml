name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: https://articles-teachers-african-enjoyed.trycloudflare.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate temporary API origin
        shell: bash
        run: |
          if [[ ! "${API_BASE_URL}" =~ ^https:// ]]; then
            echo "::error title=Invalid API_BASE_URL::GitHub Pages requires an HTTPS API origin."
            exit 1
          fi
          echo "Using API origin: ${API_BASE_URL}"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Flutter web
        run: >-
          flutter build web
          --release
          --base-href "/shift-calendar-engine-3/"
          --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
