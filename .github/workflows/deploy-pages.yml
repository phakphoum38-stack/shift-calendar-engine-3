name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://articles-teachers-african-enjoyed.trycloudflare.com' }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [[ ! "${API_BASE_URL}" =~ ^https:// ]]; then
            echo "::error title=Invalid API_BASE_URL::GitHub Pages requires an HTTPS API origin."
            exit 1
          fi

          if [[ -z "${GOOGLE_WEB_CLIENT_ID}" ]]; then
            echo "::error title=Missing GOOGLE_WEB_CLIENT_ID::Add GOOGLE_WEB_CLIENT_ID in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "API origin and Google OAuth configuration are present."

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Flutter web
        run: >-
          flutter build web
          --release
          --base-href "/shift-calendar-engine-3/"
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=GOOGLE_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"
          --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID}"

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
