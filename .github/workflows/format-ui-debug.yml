name: Format UI Debug

on:
  push:
    branches: [feature/ai-scheduler-v1]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format affected files
        run: |
          dart format \
            lib/design_system/enterprise_components.dart \
            lib/features/ai_scheduler/presentation/ai_scheduler_page.dart \
            lib/features/dashboard/presentation/dashboard_page.dart \
            test/features/ai_scheduler/presentation/ai_scheduler_page_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-ui-files
          path: |
            lib/design_system/enterprise_components.dart
            lib/features/ai_scheduler/presentation/ai_scheduler_page.dart
            lib/features/dashboard/presentation/dashboard_page.dart
            test/features/ai_scheduler/presentation/ai_scheduler_page_test.dart
