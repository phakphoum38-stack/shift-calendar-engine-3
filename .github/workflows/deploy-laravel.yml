name: Deploy Laravel Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-laravel.yml"

permissions:
  contents: read

concurrency:
  group: laravel-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Laravel backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
      - run: vendor/bin/pint --test
      - env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force
      - env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy:
    name: Deploy production on self-hosted Windows
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, shift-calendar-deploy]
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_PATH: C:\Apps\shift-calendar-backend
      PHP_EXE: C:\xampp\php\php.exe
      COMPOSER_EXE: C:\ProgramData\ComposerSetup\bin\composer.bat

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify Windows deployment tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PHP_EXE)) { throw "PHP not found at $env:PHP_EXE" }
          if (-not (Test-Path -LiteralPath $env:COMPOSER_EXE)) { throw "Composer not found at $env:COMPOSER_EXE" }
          if (-not (Get-Command robocopy.exe -ErrorAction SilentlyContinue)) { throw 'robocopy.exe is required' }
          & $env:PHP_EXE --version
          & $env:COMPOSER_EXE --version

      - name: Prepare deployment directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:DEPLOY_PATH | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:DEPLOY_PATH 'database') | Out-Null
          $db = Join-Path $env:DEPLOY_PATH 'database\database.sqlite'
          if (-not (Test-Path $db)) { New-Item -ItemType File -Path $db | Out-Null }
          $envFile = Join-Path $env:DEPLOY_PATH '.env'
          if (-not (Test-Path $envFile)) { throw "Missing production .env at $envFile" }

      - name: Enter maintenance mode
        shell: powershell
        continue-on-error: true
        run: |
          $artisan = Join-Path $env:DEPLOY_PATH 'artisan'
          if (Test-Path $artisan) {
            Push-Location $env:DEPLOY_PATH
            try { & $env:PHP_EXE artisan down --retry=60 } finally { Pop-Location }
          }

      - name: Synchronize application files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'backend'
          & robocopy.exe $source $env:DEPLOY_PATH /MIR /R:2 /W:2 /NFL /NDL /NP `
            /XF .env database.sqlite `
            /XD vendor node_modules storage\app storage\framework\cache storage\framework\sessions storage\framework\views storage\logs
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Install and activate release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:DEPLOY_PATH
          New-Item -ItemType Directory -Force -Path 'storage\framework\cache','storage\framework\sessions','storage\framework\views','storage\logs','bootstrap\cache' | Out-Null

          & $env:COMPOSER_EXE install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $modules = & $env:PHP_EXE -m
          $phpArgs = @()
          if ($modules -notcontains 'pdo_sqlite') { $phpArgs += @('-d','extension=php_pdo_sqlite.dll') }
          if ($modules -notcontains 'sqlite3') { $phpArgs += @('-d','extension=php_sqlite3.dll') }

          $envFile = Join-Path $env:DEPLOY_PATH '.env'
          $envText = Get-Content -LiteralPath $envFile -Raw
          if ($envText -match '(?m)^APP_KEY=\s*$') {
            & $env:PHP_EXE @phpArgs artisan key:generate --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          & $env:PHP_EXE @phpArgs artisan migrate --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHP_EXE @phpArgs artisan optimize:clear
          & $env:PHP_EXE @phpArgs artisan config:cache
          & $env:PHP_EXE @phpArgs artisan route:cache
          & $env:PHP_EXE @phpArgs artisan view:cache
          & $env:PHP_EXE @phpArgs artisan storage:link

      - name: Leave maintenance mode
        if: always()
        shell: powershell
        run: |
          if (Test-Path (Join-Path $env:DEPLOY_PATH 'artisan')) {
            Set-Location -LiteralPath $env:DEPLOY_PATH
            & $env:PHP_EXE artisan up
          }
