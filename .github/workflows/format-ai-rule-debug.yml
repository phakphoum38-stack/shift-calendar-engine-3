name: Format AI Rule Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-ai-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target file
        run: dart format packages/workforce_core/lib/src/ai_scheduler/ai_scheduler_rule_engine.dart
      - name: Print formatted target file
        run: |
          echo '---FORMATTED_FILE_START---'
          cat packages/workforce_core/lib/src/ai_scheduler/ai_scheduler_rule_engine.dart
          echo '---FORMATTED_FILE_END---'
