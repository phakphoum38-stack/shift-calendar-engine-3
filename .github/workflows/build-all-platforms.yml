name: Build All Platforms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "web/**"
      - "windows/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
      - ".github/workflows/build-all-platforms.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "web/**"
      - "windows/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
      - ".github/workflows/build-all-platforms.yml"

permissions:
  contents: read

concurrency:
  group: build-all-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  web:
    name: Web release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: build/web
          if-no-files-found: error

  android:
    name: Android APK release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    name: Linux release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Windows release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  macos:
    name: macOS release
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build macos --release
      - name: Package macOS application
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app macos-release.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: macos-release.zip
          if-no-files-found: error

  ios:
    name: iOS unsigned release
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS application
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-release
          path: ios-unsigned.ipa
          if-no-files-found: error
