name: Temporary Dart Format Repair

on:
  push:
    branches: [feature/ai-scheduler-v1]
    paths:
      - .github/workflows/temporary-dart-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ai-scheduler-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/features/ai_scheduler/application/ai_scheduler_controller.dart lib/features/ai_scheduler/application/ai_scheduler_request_factory.dart lib/features/ai_scheduler/presentation/ai_scheduler_page.dart lib/features/dashboard/presentation/dashboard_page.dart test/features/ai_scheduler/presentation/ai_scheduler_page_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test
          git commit -m "style: apply Dart formatter"
          git push origin HEAD:feature/ai-scheduler-v1
